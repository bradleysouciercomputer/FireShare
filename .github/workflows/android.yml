name: Build FireShare APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FireShare.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireShare-APK
          path: FireShare.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FireShare latest build
          target_commitish: main
          make_latest: true
          files: FireShare.apk
          fail_on_unmatched_files: true
          body: |
            Automatically built from the latest successful commit on main.

            Download **FireShare.apk** and open it with the Downloader app on your Fire TV.

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FireShare ${{ github.ref_name }}
          make_latest: true
          files: FireShare.apk
          fail_on_unmatched_files: true
